name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + unit tests + UI tests (Release|x64)
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      Configuration: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show .NET info
        shell: pwsh
        run: |
          dotnet --info
          Write-Host "---"
          dotnet --list-sdks

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore (Platform=x64)
        # WinUICalc.csproj computes RuntimeIdentifier from $(Platform); it must
        # be set at restore time so the win-x64 RID assets are written.
        run: dotnet restore WinUICalc.sln -p:Platform=x64

      - name: Build (Release|x64)
        run: dotnet build WinUICalc.sln -c Release -p:Platform=x64 --no-restore

      - name: Unit tests (xUnit)
        run: dotnet test WinUICalc.Tests/WinUICalc.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Setup WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.1

      - name: Install Windows App Runtime (MSIX framework packages)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msixDir = "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk.runtime\2.0.1\tools\MSIX\win10-x64"
          if (-not (Test-Path $msixDir)) { throw "MSIX dir not found: $msixDir" }
          Get-ChildItem $msixDir -Filter '*.msix' | ForEach-Object {
            Write-Host "Adding $($_.Name)"
            Add-AppxPackage -Path $_.FullName -ForceApplicationShutdown
          }
          Get-AppxPackage Microsoft.WindowsAppRuntime.2 | Format-List Name, Version, Architecture, IsFramework, PackageFullName

      - name: UI tests (winapp run + ui-tests.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $buildDir = 'WinUICalc/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64'
          if (-not (Test-Path $buildDir)) { throw "Build dir not found: $buildDir" }

          Write-Host "Launching app via 'winapp run'..." -ForegroundColor Cyan
          $launchRaw = winapp run $buildDir --detach --json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Host $launchRaw
            throw "winapp run failed (exit $LASTEXITCODE)"
          }
          $launch = $launchRaw | ConvertFrom-Json
          $appPid = [int]$launch.ProcessId
          if (-not $appPid) { throw "Could not parse ProcessId from launch output." }
          Write-Host ("Launched PID {0}  AUMID {1}" -f $appPid, $launch.AUMID) -ForegroundColor Green

          $exitCode = 1
          try {
            winapp ui wait-for 'AppTitleBar' -a $appPid -t 30000
            if ($LASTEXITCODE -ne 0) { throw "AppTitleBar did not appear within 30s." }

            pwsh -NoProfile -File ui-tests/ui-tests.ps1 -AppPid $appPid
            $exitCode = $LASTEXITCODE
          }
          finally {
            Stop-Process -Id $appPid -Force -ErrorAction SilentlyContinue
          }

          if ($exitCode -ne 0) { throw "UI tests failed (exit $exitCode)" }

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/*.trx
            ui-tests/test-results.json
            ui-tests/test-screenshot.png
          if-no-files-found: warn
